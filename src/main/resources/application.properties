spring.application.name=productos

# Configuración Base para MySQL (Los valores reales los sobreescribirá Docker)
spring.datasource.url=jdbc:mysql://db-mysql:3306/innovatech_db
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate para MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivamos la consola de H2 ya que no la usaremos en AWS
spring.h2.console.enabled=false