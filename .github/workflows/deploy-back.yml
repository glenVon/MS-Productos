name: Deploy Backend to EC2 (Private via Proxy)

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-backend:latest

      - name: Desplegar en EC2 Backend via SSH Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Destino Final (Backend Privado)
          host: ${{ secrets.EC2_BACK_IP }} 
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          # El Salto (Frontend Público)
          proxy_host: ${{ secrets.EC2_FRONT_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          script: |
            # 1. Crear el archivo docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              backend-api:
                image: ${{ secrets.DOCKER_USERNAME }}/innovatech-backend:latest
                ports:
                  - "8080:8080"
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/innovatech_db
                  - SPRING_DATASOURCE_USERNAME=root
                  - SPRING_DATASOURCE_PASSWORD=root_password
                depends_on:
                  - db-mysql
              db-mysql:
                image: mysql:8.0
                environment:
                  MYSQL_ROOT_PASSWORD: root_password
                  MYSQL_DATABASE: innovatech_db
                volumes:
                  - db_data:/var/lib/mysql
            volumes:
              db_data:
            EOF
            
            # 2. Instalar el plugin de Docker Compose en la máquina si no existe
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            
            # 3. Desplegar los contenedores
            sudo docker compose down || true
            sudo docker compose pull backend-api
            sudo docker compose up -d
            sudo docker compose logs backend-api